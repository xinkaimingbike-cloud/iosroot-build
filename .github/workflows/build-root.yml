name: build-hfs-root

# 从 IPSW 造 ios-fuxi 需要的 HFS+ 根镜像（iOS 16.7.16 / 20H392 / iPhone10,3）。
# 产物按 1900M 分卷，挂到 GitHub Release 上（Release 附件不占 Actions 存储配额）。

on:
  workflow_dispatch:
    inputs:
      ipsw_url:
        description: 'IPSW 直链（Apple CDN .ipsw）'
        required: true
        default: 'https://updates.cdn-apple.com/2025FallFCS/fullrestores/122-77006/1158E502-D76D-4226-AA06-ED5E30CD1111/iPhone10,3,iPhone10,6_16.7.16_20H392_Restore.ipsw'
      ipsw_sha256:
        description: 'IPSW 的 sha256（留空跳过校验）'
        required: false
        default: 'ece1194f7e233e9109c5790a8d23a4564a10a254e15ec5b09978a343265568fb'
      size:
        description: '镜像大小'
        required: false
        default: '10G'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - name: 腾磁盘
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/powershell /usr/share/swift || true
          sudo docker image prune -af || true
          sudo apt-get clean
          df -h /

      - name: 装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y hfsprogs rsync unzip cmake g++ git make \
              libfuse3-dev libbz2-dev zlib1g-dev libssl-dev pkg-config
          sudo modprobe hfsplus || true
          ls -l /dev/fuse

      - name: 下载 IPSW
        env:
          URL: ${{ inputs.ipsw_url }}
          SHA: ${{ inputs.ipsw_sha256 }}
        run: |
          mkdir -p /tmp/work
          curl -L --fail --retry 5 --retry-delay 5 -o /tmp/work/root.ipsw "$URL"
          ls -l /tmp/work/root.ipsw
          if [ -n "$SHA" ]; then echo "$SHA  /tmp/work/root.ipsw" | sha256sum -c -; fi
          df -h /

      - name: 造 HFS+ 根镜像
        env:
          SIZE: ${{ inputs.size }}
        run: |
          sudo bash scripts/mkiosroot-linux.sh /tmp/work/root.ipsw /tmp/work/iosroot.img "$SIZE"
          df -h /

      - name: 分卷 + 校验
        run: |
          cd /tmp/work
          split -b 1900M -d -a 2 iosroot.img iosroot.img.part
          sha256sum iosroot.img > iosroot.img.sha256
          sha256sum iosroot.img.part* > iosroot.img.parts.sha256
          ls -l

      - name: 挂到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: root-${{ github.run_id }}
        run: |
          cd /tmp/work
          gh release create "$TAG" --repo "${{ github.repository }}" \
             --title "HFS+ root image $TAG" \
             --notes "iOS 16.7.16 / 20H392 HFS+ root for ios-fuxi (fuxi). 分卷 1900M，合并: cat iosroot.img.part* > iosroot.img" \
             iosroot.img.part* iosroot.img.sha256 iosroot.img.parts.sha256

      - name: 汇总
        run: |
          cd /tmp/work
          echo "SIZE=$(du -h iosroot.img | cut -f1)"
          cat iosroot.img.sha256
