name: build-hfs-root

# 从 IPSW 造 ios-fuxi 需要的 HFS+ 根镜像（iOS 16.7.16 / 20H392 / iPhone10,3）。
# 跑在 macOS runner 上：hdiutil 原生读 DMG/APFS，系统原生支持 HFS+。
# （Ubuntu runner 的内核没有编 hfsplus 模块，mount 必然失败，所以不用 Linux。）
#
# 注意：GitHub macOS runner 可用磁盘只有 ~14 GB，删 Xcode 腾空间，脚本里 dmg 用完即删。

on:
  workflow_dispatch:
    inputs:
      ipsw_url:
        description: 'IPSW 直链（Apple CDN .ipsw）'
        required: true
        default: 'https://updates.cdn-apple.com/2025FallFCS/fullrestores/122-77006/1158E502-D76D-4226-AA06-ED5E30CD1111/iPhone10,3,iPhone10,6_16.7.16_20H392_Restore.ipsw'
      ipsw_sha256:
        description: 'IPSW 的 sha256（留空跳过校验）'
        required: false
        default: 'ece1194f7e233e9109c5790a8d23a4564a10a254e15ec5b09978a343265568fb'
      size:
        description: '镜像大小（内容约 6.5G，9G 有富余）'
        required: false
        default: '9G'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-13
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - name: 腾磁盘
        run: |
          df -h /
          sudo rm -rf /Applications/Xcode*.app || true
          sudo rm -rf ~/Library/Developer/CoreSimulator/Caches/* || true
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/* || true
          sudo rm -rf /usr/local/Homebrew/Library/Taps || true
          df -h /

      - name: 下载 IPSW
        env:
          URL: ${{ inputs.ipsw_url }}
          SHA: ${{ inputs.ipsw_sha256 }}
        run: |
          mkdir -p /tmp/work
          curl -L --fail --retry 5 --retry-delay 5 -o /tmp/work/root.ipsw "$URL"
          ls -l /tmp/work/root.ipsw
          if [ -n "$SHA" ]; then echo "$SHA  /tmp/work/root.ipsw" | shasum -a 256 -c -; fi
          df -h /

      - name: 造 HFS+ 根镜像
        env:
          SIZE: ${{ inputs.size }}
        run: |
          sudo bash scripts/mkiosroot-macos.sh /tmp/work/root.ipsw /tmp/work/iosroot.img "$SIZE"
          df -h /

      - name: 分卷 + 校验
        run: |
          cd /tmp/work
          split -b 1900m -a 2 iosroot.img iosroot.img.part
          shasum -a 256 iosroot.img > iosroot.img.sha256
          shasum -a 256 iosroot.img.part* > iosroot.img.parts.sha256
          ls -l

      - name: 挂到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: root-${{ github.run_id }}
        run: |
          cd /tmp/work
          gh release create "$TAG" --repo "${{ github.repository }}" \
            --title "HFS+ root image $TAG" \
            --notes "iOS 16.7.16 / 20H392 HFS+ root for ios-fuxi (fuxi). 分卷 1900M，合并: cat iosroot.img.part* > iosroot.img" \
            iosroot.img.part* iosroot.img.sha256 iosroot.img.parts.sha256

      - name: 汇总
        run: |
          cd /tmp/work
          ls -l iosroot.img
          cat iosroot.img.sha256
