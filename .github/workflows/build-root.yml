name: build-hfs-root

# 从 IPSW 造 ios-fuxi 需要的 HFS+ 根镜像（iOS 16.7.16 / 20H392 / iPhone10,3）。
#
# 环境选择：默认 ubuntu-latest。
#   * ubuntu-26.04 的内核 7.0.0-1019-azure 自带 hfsplus.ko.zst，modprobe 可用，
#     mkfs.hfsplus + mount -o loop,force 都能跑（2026-11-10 已实测）。
#   * 早期 ubuntu runner 的内核 6.8.0-1070-azure 没有 hfsplus，所以老结论"Linux 必失败"已过期。
#   * macOS runner 在 GitHub Free 计划下不可用（一创建就 cancelled），因此不作为默认。
#
# 磁盘：镜像用 truncate 造稀疏文件，实际占用随内容增长（约 7G），
# IPSW 在解出 dmg 后立刻删除，峰值约 14G。

on:
  workflow_dispatch:
    inputs:
      ipsw_url:
        description: 'IPSW 直链（Apple CDN .ipsw）'
        required: true
        default: 'https://updates.cdn-apple.com/2025FallFCS/fullrestores/122-77006/1158E502-D76D-4226-AA06-ED5E30CD1111/iPhone10,3,iPhone10,6_16.7.16_20H392_Restore.ipsw'
      ipsw_sha256:
        description: 'IPSW 的 sha256（留空跳过校验）'
        required: false
        default: 'ece1194f7e233e9109c5790a8d23a4564a10a254e15ec5b09978a343265568fb'
      size:
        description: '镜像大小（iOS16 root 解压后远超 dmg 体积，16G 起）'
        required: false
        default: '16G'
      runner:
        description: 'runner：ubuntu-latest（可用）/ macos-14（Free 计划不可用）'
        required: false
        default: 'ubuntu-latest'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - name: 环境与磁盘
        run: |
          uname -a
          df -h /
          nproc
          free -g | head -2

      - name: 下载 IPSW
        env:
          URL: ${{ inputs.ipsw_url }}
          SHA: ${{ inputs.ipsw_sha256 }}
        run: |
          mkdir -p /tmp/work
          curl -L --fail --retry 5 --retry-delay 5 -o /tmp/work/root.ipsw "$URL"
          ls -l /tmp/work/root.ipsw
          if [ -n "$SHA" ]; then
            if command -v sha256sum >/dev/null; then
              echo "$SHA  /tmp/work/root.ipsw" | sha256sum -c -
            else
              echo "$SHA  /tmp/work/root.ipsw" | shasum -a 256 -c -
            fi
          fi
          df -h /

      - name: 造 HFS+ 根镜像
        env:
          SIZE: ${{ inputs.size }}
          RUNNER: ${{ inputs.runner }}
        run: |
          if [[ "$RUNNER" == macos* ]]; then
            SCRIPT=scripts/mkiosroot-macos.sh
          else
            SCRIPT=scripts/mkiosroot-linux.sh
          fi
          echo "使用脚本: $SCRIPT"
          sudo bash "$SCRIPT" /tmp/work/root.ipsw /tmp/work/iosroot.img "$SIZE"
          df -h /

      - name: 分卷 + 校验
        run: |
          cd /tmp/work
          split -b 1900m -a 2 iosroot.img iosroot.img.part
          if command -v sha256sum >/dev/null; then SH="sha256sum"; else SH="shasum -a 256"; fi
          $SH iosroot.img > iosroot.img.sha256
          # 只对分卷本体（partaa..partzz）做校验，别把 .parts.sha256 自己算进去
          $SH iosroot.img.part?? > iosroot.img.parts.sha256
          ls -l

      - name: 建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: root-${{ github.run_id }}
        run: |
          cd /tmp/work
          gh release create "$TAG" --repo "${{ github.repository }}" \
            --title "HFS+ root image $TAG" \
            --notes "iOS 16.7.16 / 20H392 HFS+ root for ios-fuxi (fuxi). 分卷 1900M，合并: cat iosroot.img.part?? > iosroot.img"

      - name: 上传分卷
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: root-${{ github.run_id }}
        run: |
          cd /tmp/work
          # 逐个上传并允许覆盖；避免 gh release create 里一次传多个资产时的名字冲突
          gh release upload "$TAG" iosroot.img.part?? iosroot.img.sha256 iosroot.img.parts.sha256 \
            --repo "${{ github.repository }}" --clobber
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets \
            --jq '.assets[] | "\(.name) \(.size)"'

      - name: 汇总
        run: |
          cd /tmp/work
          ls -l iosroot.img
          cat iosroot.img.sha256
          cat iosroot.img.parts.sha256
